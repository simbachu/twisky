name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate style.css (go generate ./static)
        run: go generate ./static

      - name: Run tests
        run: go test ./...

  deploy:
    name: Build image and deploy to VPS
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: twisky_staging
    permissions:
      contents: read
      packages: write
    outputs:
      failure_stage: ${{ steps.record.outputs.failure_stage }}
      healthz_body: ${{ steps.record.outputs.healthz_body }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/twisky/server:main
            ghcr.io/${{ github.repository_owner }}/twisky/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VPS
        id: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PUBLIC_BASE_URL: ${{ vars.DEPLOY_PUBLIC_BASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TWISKY_SESSION_SECRET: ${{ secrets.TWISKY_SESSION_SECRET }}
          # The ephemeral GITHUB_TOKEN cannot pull this private package from the VPS
          # (it is not auto-linked to the repo). Use a dedicated read:packages PAT.
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_HOST}" || -z "${DEPLOY_USER}" ]]; then
            echo "Set environment variables DEPLOY_HOST and DEPLOY_USER in twisky_staging." >&2
            exit 1
          fi

          if [[ -z "${DEPLOY_PUBLIC_BASE_URL}" ]]; then
            echo "Set environment variable DEPLOY_PUBLIC_BASE_URL in twisky_staging." >&2
            exit 1
          fi

          if [[ -z "${SSH_PRIVATE_KEY}" || -z "${SSH_KNOWN_HOSTS}" ]]; then
            echo "Set environment secrets DEPLOY_SSH_PRIVATE_KEY and DEPLOY_SSH_KNOWN_HOSTS in twisky_staging." >&2
            exit 1
          fi

          if [[ -z "${TWISKY_SESSION_SECRET}" ]]; then
            echo "Set environment secret TWISKY_SESSION_SECRET in twisky_staging." >&2
            exit 1
          fi

          if [[ -z "${GHCR_TOKEN}" ]]; then
            echo "Set repository secret GHCR_PULL_TOKEN (a read:packages PAT)." >&2
            exit 1
          fi

          install -m 700 -d "${HOME}/.ssh"
          echo "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          echo "${SSH_KNOWN_HOSTS}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(
            -i "${HOME}/.ssh/deploy_key"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_opts[@]}" "${ssh_target}" "test -d /opt/twisky && test -w /opt/twisky" || {
            echo "/opt/twisky is missing or not writable by ${DEPLOY_USER}." >&2
            echo "On the VPS as root: sudo mkdir -p /opt/twisky && sudo chown ${DEPLOY_USER}:${DEPLOY_USER} /opt/twisky" >&2
            exit 1
          }

          scp "${ssh_opts[@]}" \
            docker/docker-compose.deploy.yml \
            "${ssh_target}:/opt/twisky/docker-compose.deploy.yml"
          scp "${ssh_opts[@]}" \
            scripts/vps-deploy.sh \
            "${ssh_target}:/opt/twisky/vps-deploy.sh"
          ssh "${ssh_opts[@]}" "${ssh_target}" "chmod +x /opt/twisky/vps-deploy.sh"

          # Do not pass secrets on the ssh command line: shell quoting can corrupt
          # characters before they reach the VPS. Base64 survives remote sh -c.
          ghcr_token_b64="$(printf '%s' "${GHCR_TOKEN}" | base64 -w 0)"
          session_secret_b64="$(printf '%s' "${TWISKY_SESSION_SECRET}" | base64 -w 0)"
          ghcr_user_q="$(printf '%q' "${GHCR_USER}")"
          deploy_public_base_url_q="$(printf '%q' "${DEPLOY_PUBLIC_BASE_URL}")"
          ssh "${ssh_opts[@]}" "${ssh_target}" \
            "GHCR_TOKEN=\$(printf '%s' '${ghcr_token_b64}' | base64 -d) TWISKY_SESSION_SECRET=\$(printf '%s' '${session_secret_b64}' | base64 -d) GHCR_USER=${ghcr_user_q} DEPLOY_PUBLIC_BASE_URL=${deploy_public_base_url_q} bash /opt/twisky/vps-deploy.sh"

      - name: Verify public /healthz serves this commit
        id: healthz
        env:
          DEPLOY_PUBLIC_BASE_URL: ${{ vars.DEPLOY_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          base_url="${DEPLOY_PUBLIC_BASE_URL}"
          base_url="${base_url%/}"
          # healthz returns "ok <first 7 chars of the build id>"; the image is
          # built with GIT_SHA=${{ github.sha }}, so this confirms the new build
          # is the one actually serving public traffic through the shared edge.
          expected="${GITHUB_SHA:0:7}"
          echo "Probing ${base_url}/healthz for build ${expected}"
          last_body=""
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 5 "${base_url}/healthz" || true)"
            last_body="${body}"
            if [[ "${body}" == *"${expected}"* ]]; then
              echo "Public /healthz reports build ${expected}: ${body}"
              exit 0
            fi
            echo "Attempt ${attempt}: got '${body:-<no response>}', retrying in 4s..."
            sleep 4
          done
          echo "healthz_body=${last_body:-<no response>}" >> "${GITHUB_OUTPUT}"
          echo "Public /healthz did not report build ${expected} within timeout" >&2
          exit 1

      - name: Record deploy outcome
        id: record
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" == "failure" ]]; then
            echo "failure_stage=build" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ steps.deploy.outcome }}" == "failure" ]]; then
            echo "failure_stage=deploy" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ steps.healthz.outcome }}" == "failure" ]]; then
            echo "failure_stage=healthz" >> "${GITHUB_OUTPUT}"
            echo "healthz_body=${{ steps.healthz.outputs.healthz_body }}" >> "${GITHUB_OUTPUT}"
          fi

  notify:
    name: Discord notification
    needs: [test, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: twisky_staging
    permissions:
      actions: read
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_PUBLIC_BASE_URL: ${{ vars.DEPLOY_PUBLIC_BASE_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          FAILURE_STAGE: ${{ needs.deploy.outputs.failure_stage }}
          HEALTHZ_BODY: ${{ needs.deploy.outputs.healthz_body }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK:-}" ]]; then
            echo "DISCORD_WEBHOOK is not set; skipping Discord notification."
            exit 0
          fi

          sha="${GITHUB_SHA:0:7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          error_snippet() {
            gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>/dev/null \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | tail -8 \
              | tr '\n' ' ' \
              | head -c 400 \
              || true
          }

          post_discord() {
            local content="$1"
            local payload
            payload="$(jq -n --arg content "${content}" '{content: $content}')"
            curl -fsS -X POST -H "Content-Type: application/json" -d "${payload}" "${DISCORD_WEBHOOK}"
          }

          if [[ "${TEST_RESULT}" == "failure" ]]; then
            snippet="$(error_snippet)"
            if [[ -z "${snippet// }" ]]; then
              snippet="${run_url}"
            fi
            post_discord "Commit #${sha} failed at test stage: ${snippet}"
            exit 0
          fi

          if [[ "${DEPLOY_RESULT}" == "success" ]]; then
            base_url="${DEPLOY_PUBLIC_BASE_URL%/}"
            post_discord "Commit #${sha} is up: ${base_url}/healthz"
            exit 0
          fi

          if [[ "${DEPLOY_RESULT}" == "failure" ]]; then
            stage="${FAILURE_STAGE:-deploy}"
            if [[ "${stage}" == "healthz" ]]; then
              if [[ -n "${HEALTHZ_BODY:-}" ]]; then
                detail="Public /healthz did not report build ${sha} (last: ${HEALTHZ_BODY})"
              else
                detail="$(error_snippet)"
                if [[ -z "${detail// }" ]]; then
                  detail="${run_url}"
                fi
              fi
            else
              detail="$(error_snippet)"
              if [[ -z "${detail// }" ]]; then
                detail="${run_url}"
              fi
            fi
            post_discord "Commit #${sha} failed at ${stage} stage: ${detail}"
            exit 0
          fi

          echo "No notification needed (test=${TEST_RESULT}, deploy=${DEPLOY_RESULT})."
